[project]
name = "llm-classify"
version = "0.1.0"
description = "Image classification with Qwen3-VL"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7.0",
    "torchvision>=0.22.0",
    "transformers>=4.57.0",
    "qwen-vl-utils>=0.0.14",
    "accelerate>=1.0.0",
    "pillow>=11.0.0",
    "datasets>=3.0.0",
    "matplotlib>=3.9.0",
    "pyyaml>=6.0",
    "outlines>=0.1.0",
    "jupyter>=1.1.1",
    "kagglehub>=0.3.0",
    "supervision>=0.25.0",
    "lab>=8.8",
    "sam2>=0.1.0",
    "bitsandbytes>=0.49.1",
    "ultralytics>=8.4.16",
    "peft>=0.17.0",
    "autorootcwd>=1.0.1",
    "rfdetr>=1.5.0",
]

[[tool.uv.index]]
url = "https://download.pytorch.org/whl/nightly/cu128"
explicit = true

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[dependency-groups]
dev = [
    "ipykernel>=6.29.0",
]
